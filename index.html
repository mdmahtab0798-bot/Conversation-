<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b075b">
<title>CreatorHub Mxxxxb</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{--purple:#59066a;--pink:#e75bd5;--bg:#f7f3f8;--ink:#211927;--muted:#8b8490;--line:#eee7f0;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;height:100dvh;overflow:hidden}
button,input{font:inherit}button{cursor:pointer;border:0}.app{height:100dvh;max-width:520px;margin:auto;background:#fff;display:flex;flex-direction:column;position:relative}
.top{padding:17px 18px 12px;background:#fff;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{width:39px;height:39px;border-radius:14px;background:linear-gradient(145deg,var(--purple),var(--pink));display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900}.brand h1{font-size:18px;margin:0;font-weight:800}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.iconbtn{width:37px;height:37px;border-radius:50%;background:#f7f1f8;color:var(--purple);font-size:17px}
.tabs{display:flex;gap:25px;padding:5px 20px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}.tab{background:none;color:#938a96;padding:7px 0;position:relative}.tab.active{color:var(--purple)}.tab.active:after{content:"";position:absolute;bottom:-13px;left:0;right:0;height:3px;background:var(--pink)}
main{flex:1;overflow:auto;padding-bottom:78px}.screen{display:none}.screen.active{display:block}.search{margin:15px 17px;background:#f7f4f8;border-radius:14px;padding:11px 14px;display:flex;gap:9px}.search input{border:0;background:transparent;outline:0;width:100%;font-size:13px}
.section-title{font-size:12px;font-weight:800;margin:16px 18px 10px;color:#514456}.stories{display:flex;gap:14px;overflow:auto;padding:0 17px 14px}.story{min-width:62px;text-align:center;font-size:10px;color:#665c6b}.avatar{width:53px;height:53px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800;font-size:16px;background:linear-gradient(145deg,#f0a5df,#650b76);margin:0 auto 6px}
.contact{display:flex;align-items:center;padding:11px 18px;gap:12px;border-bottom:1px solid #f5f0f6}.contact .avatar{width:47px;height:47px;margin:0}.contact-info{flex:1;min-width:0}.contact-info b{font-size:13px}.contact-info p{margin:4px 0 0;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.bottom{position:absolute;bottom:0;left:0;right:0;height:69px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:100}.nav{background:none;color:#a59aa8;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:54px}.nav span{font-size:20px}.nav.active{color:var(--purple)}.fab{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,var(--purple),var(--pink));color:white;font-size:25px;margin-top:-24px}
.panel{margin:14px 17px;padding:15px;border:1px solid var(--line);border-radius:17px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0 10px}.primary{background:var(--purple);color:#fff;width:100%;padding:12px;border-radius:12px}
.chat-head{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.chat-head .avatar{margin:0;width:40px;height:40px}.chat-area{height:calc(100dvh - 245px);overflow:auto;padding:15px;background:#fbf8fc;display:flex;flex-direction:column;gap:9px}.bubble{max-width:82%;padding:10px 12px;border-radius:14px;background:#fff;font-size:13px}.bubble.mine{align-self:flex-end;background:#f1dff4;border-bottom-right-radius:4px}.bubble.theirs{align-self:flex-start;border-bottom-left-radius:4px}.composer{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line);align-items:center}.composer input{flex:1;border:0;background:#f7f3f8;padding:12px;border-radius:22px;outline:0;font-size:13px}.send{width:42px;height:42px;border-radius:50%;background:var(--purple);color:#fff}
.empty{text-align:center;padding:45px 25px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">C</div><div><h1>CreatorHub Mxxxxb</h1><small>Stay close. Create together.</small></div></div>
 <div class="top-actions"><button class="iconbtn" onclick="showScreen('search')">⌕</button><button class="iconbtn" onclick="showScreen('profile')">☻</button></div>
</header>
<div class="tabs" id="mainTabs"><button class="tab active" data-tab="chats" onclick="showScreen('chats',this)">Messages</button><button class="tab" data-tab="groups" onclick="showScreen('groups',this)">Groups</button></div>
<main>
<section class="screen active" id="chats">
 <div class="search"><span>⌕</span><input id="chatSearch" placeholder="Search people..." oninput="renderContacts()"></div>
 <div class="section-title">MESSAGES</div>
 <div id="contacts"></div>
</section>
<section class="screen" id="search">
 <div class="panel"><h3>Find a friend</h3><input class="field" id="friendId" placeholder="Paste friend's ID here"><button class="primary" onclick="connectFriend()">Connect</button></div>
 <div class="panel"><h3>Your Chat ID</h3><div id="myId" style="font-size:12px;overflow-wrap:anywhere;color:#5b0a68;margin:8px 0">Loading ID...</div><button class="primary" style="background:#f5eaf7;color:var(--purple)" onclick="copyId()">Copy my ID</button></div>
</section>
<section class="screen" id="chatScreen">
 <div class="chat-head"><button class="iconbtn" onclick="showScreen('chats')">‹</button><div class="avatar" id="chatAvatar">?</div><div style="flex:1"><b id="chatName">Friend</b><small style="display:block;color:#2aa66c;font-size:10px" id="chatStatus">Online</small></div></div>
 <div class="chat-area" id="chatArea"><div class="empty">Say hello!</div></div>
 <div class="composer"><input id="messageInput" placeholder="Message…"><button class="send" onclick="sendMessage()">➤</button></div>
</section>
<section class="screen" id="profile">
 <div class="panel" style="text-align:center"><div class="avatar" id="profileAvatar" style="width:78px;height:78px;font-size:25px">C</div><h3 id="profileName">User</h3></div>
 <div class="panel"><h3>Edit profile</h3><input class="field" id="nameInput" placeholder="Display name"><button class="primary" onclick="saveProfile()">Save profile</button></div>
</section>
</main>
<nav class="bottom">
 <button class="nav active" onclick="showScreen('chats',null,this)"><span>▣</span>Chats</button>
 <button class="fab" onclick="showScreen('search')">＋</button>
 <button class="nav" onclick="showScreen('profile',null,this)"><span>⚙</span>Profile</button>
</nav>
</div>
<script>
let peer=null,myId='',myName='',connections={},activePeer='';
try { myName = localStorage.getItem('ch_name') || 'User'; } catch (e) {}

const $=id=>document.getElementById(id);
let chats = {};

function showScreen(id,tab,nav){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  $(id).classList.add('active');
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  if(nav)nav.classList.add('active');
  $('mainTabs').style.display=(id==='chatScreen'||id==='search'||id==='profile')?'none':'flex';
}

function initPeer(){
  const savedId = 'ch-'+Math.floor(10000+Math.random()*90000);
  peer=new Peer(savedId);
  peer.on('open',pid=>{ myId=pid; $('myId').textContent=pid; });
  peer.on('connection',conn=>attachConnection(conn));
}

function connectFriend(){
  const id=$('friendId').value.trim();
  if(!id||id===myId) return alert('Invalid ID.');
  const conn=peer.connect(id);
  attachConnection(conn);
  $('friendId').value='';
  showScreen('chats');
}

function attachConnection(conn){
  conn.on('open',()=>{
    connections[conn.peer]=conn;
    renderContacts();
  });
  conn.on('data',data=>{
    if(data.type==='message') {
        chats[conn.peer] = chats[conn.peer] || [];
        chats[conn.peer].push({text:data.text, mine:false});
        if(activePeer===conn.peer) renderChat();
    }
  });
}

function openChat(id){
  activePeer=id;
  $('chatName').textContent=id;
  $('chatAvatar').textContent=id.slice(0,2).toUpperCase();
  showScreen('chatScreen');
  renderChat();
}

function sendMessage(){
  const text=$('messageInput').value.trim();
  if(!text || !connections[activePeer]) return;
  connections[activePeer].send({type:'message',text});
  chats[activePeer] = chats[activePeer] || [];
  chats[activePeer].push({text, mine:true});
  $('messageInput').value='';
  renderChat();
}

function renderChat(){
  const area=$('chatArea'), items=chats[activePeer]||[];
  area.innerHTML='';
  items.forEach(m=>{
    const b=document.createElement('div');
    b.className='bubble '+(m.mine?'mine':'theirs');
    b.textContent=m.text;
    area.appendChild(b);
  });
}

function renderContacts(){
  const list=$('contacts'); list.innerHTML='';
  Object.keys(connections).forEach(id=>{
    const d=document.createElement('div');
    d.className='contact';
    d.innerHTML=`<div class="avatar">${id.slice(0,2).toUpperCase()}</div><div class="contact-info"><b>${id}</b><p>Connected</p></div>`;
    d.onclick=()=>openChat(id);
    list.appendChild(d);
  });
}

function copyId(){ navigator.clipboard.writeText(myId); alert('ID Copied: '+myId); }
function saveProfile(){
  myName=$('nameInput').value.trim();
  try{ localStorage.setItem('ch_name',myName); }catch(e){}
  $('profileName').textContent=myName;
  $('profileAvatar').textContent=myName.slice(0,2).toUpperCase();
}

document.addEventListener('DOMContentLoaded',()=>{
  $('profileName').textContent=myName;
  $('profileAvatar').textContent=myName.slice(0,2).toUpperCase();
  initPeer();
});
</script>
</body>
</html>
